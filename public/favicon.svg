<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1a1410"/>

  <!-- Film strip notches top -->
  <rect x="3" y="2" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="9" y="2" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="19" y="2" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="25" y="2" width="4" height="3" rx="1" fill="#b8860b"/>

  <!-- Film strip notches bottom -->
  <rect x="3" y="27" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="9" y="27" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="19" y="27" width="4" height="3" rx="1" fill="#b8860b"/>
  <rect x="25" y="27" width="4" height="3" rx="1" fill="#b8860b"/>

  <!-- Italic A letter - Playfair style -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="19"
    font-weight="700"
    font-style="italic"
    fill="#c8a84c"
  >A</text>
</svg>
